<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100">
    <main class="mx-auto flex min-h-screen w-full max-w-4xl items-center justify-center px-4 py-10">
      <section class="w-full rounded-2xl bg-white p-6 shadow-lg sm:p-8 md:p-10">
        <div class="mb-8 text-center">
          <h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">Contact Us</h1>
          <p class="mt-3 text-sm text-slate-600 sm:text-base">
            Have a question? Send us a message and we’ll get back to you soon.
          </p>
        </div>

        <form class="grid grid-cols-1 gap-5 sm:grid-cols-2" action="#" method="post">
          <div>
            <label for="firstName" class="mb-2 block text-sm font-medium text-slate-700">First name</label>
            <input
              id="firstName"
              name="firstName"
              type="text"
              required
              class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-900 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring"
              placeholder="Jane"
            />
          </div>

          <div>
            <label for="lastName" class="mb-2 block text-sm font-medium text-slate-700">Last name</label>
            <input
              id="lastName"
              name="lastName"
              type="text"
              required
              class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-900 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring"
              placeholder="Doe"
            />
          </div>

          <div class="sm:col-span-2">
            <label for="email" class="mb-2 block text-sm font-medium text-slate-700">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              required
              class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-900 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring"
              placeholder="jane@example.com"
            />
          </div>

          <div class="sm:col-span-2">
            <label for="subject" class="mb-2 block text-sm font-medium text-slate-700">Subject</label>
            <input
              id="subject"
              name="subject"
              type="text"
              class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-900 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring"
              placeholder="How can we help?"
            />
          </div>

          <div class="sm:col-span-2">
            <label for="message" class="mb-2 block text-sm font-medium text-slate-700">Message</label>
            <textarea
              id="message"
              name="message"
              rows="5"
              required
              class="w-full resize-y rounded-lg border border-slate-300 px-4 py-2.5 text-slate-900 outline-none ring-indigo-200 transition focus:border-indigo-500 focus:ring"
              placeholder="Write your message..."
            ></textarea>
          </div>

          <div class="sm:col-span-2">
            <button
              type="submit"
              class="w-full rounded-lg bg-indigo-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
            >
              Send Message
            </button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
